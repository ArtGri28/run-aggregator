# Только для интеграционных тестов (D-01) — не production-состав MVP.md §10.2
# (тот появляется в Phase 6). Порт публикуется только на 127.0.0.1, аутентификация
# trust (без пароля): база одноразовая, без данных, наружу не смотрит.
name: aggregator-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_DB: aggregator_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aggregator -d aggregator_test"]
      interval: 1s
      timeout: 3s
      retries: 30
