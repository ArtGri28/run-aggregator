# Production-состав MVP.md §10.2 (PRD-01): postgres, одноразовый migrate, bot, worker;
# за профилем webapp (Phase 15, D-19) — webapp (API и статика Mini App) и caddy (HTTPS).
# Лежит на VPS в /opt/aggregator рядом с .env (права 600); значения секретов
# подставляются из .env интерполяцией ${VAR}, в этом файле их нет.
#
# Наружу публикуются только 80/tcp и 443/tcp сервиса caddy и только при включённом
# профиле webapp (строка COMPOSE_PROFILES=webapp в .env); без неё состав прежний и
# наружу не публикуется ничего. Порт PostgreSQL не публикуется никогда: порты Docker
# обходят ufw, а база нужна только соседним контейнерам по внутренней сети проекта.
# caddy подключён только к сети edge и видит один webapp; postgres ему недоступен.
# Каждому сервису передаются только нужные ему переменные (общий файл
# переменных не подключается): токен бота есть только у bot, контакт владельца
# только у worker. healthcheck bot и worker — по отметке компоненты в таблице
# heartbeats (не старше 5 минут); бот ставит свою, только пока отвечает getMe. Необязательные OBSERVE_* и QUALITY_* при необходимости
# добавляются одинаково в bot и worker (Pitfall 11: принятие прогона ботом
# должно наблюдать так же, как worker).
# DEDUP_* объявлены в якоре x-app-env, общем для bot и worker: проход
# дедупликации в worker и принятие кнопкой в боте видят одну конфигурацию;
# туда же при необходимости добавляются OBSERVE_* и QUALITY_*.
#
# Пароль Postgres действует только при первой инициализации тома: смена в .env
# без ALTER ROLE приведёт к отказу аутентификации.
# Тома pgdata, raw и caddy_data (сертификаты) НЕ удаляются никогда (без флага -v
# у down): бэкапов до Phase 6 нет. Откат образа — сменой IMAGE_TAG в .env.
name: aggregator

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  DATABASE_URL: postgres://aggregator@postgres:5432/aggregator?sslmode=disable
  PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
  LOG_FORMAT: ${LOG_FORMAT:-}

# Пустое значение DEDUP_* = значение по умолчанию из кода (dedup.DefaultConfig),
# автослияние выключено.
x-app-env: &app-env
  <<: *db-env
  DEDUP_HIGH: ${DEDUP_HIGH:-}
  DEDUP_LOW: ${DEDUP_LOW:-}
  DEDUP_AUTO_MERGE: ${DEDUP_AUTO_MERGE:-}
  DEDUP_LINK_BONUS: ${DEDUP_LINK_BONUS:-}
  DEDUP_MAX_PER_EVENT: ${DEDUP_MAX_PER_EVENT:-}
  DEDUP_DISTANCE_TOL_M: ${DEDUP_DISTANCE_TOL_M:-}
  DEDUP_SOURCE_PRIORITY: ${DEDUP_SOURCE_PRIORITY:-}
  DEDUP_DIGEST_AT: ${DEDUP_DIGEST_AT:-}
  MYRACE_TOKEN: ${MYRACE_TOKEN:-}

x-app: &app
  image: aggregator:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
  # Пользователь задаётся здесь, а не только в образе: образ приходит через agg load,
  # и объявленный в нём USER root не должен действовать.
  user: "65532:65532"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *log
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_DB: aggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aggregator -d aggregator"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *log

  migrate:
    image: aggregator:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
    command: ["migrate"]
    user: "65532:65532"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *log

  bot:
    <<: *app
    command: ["bot"]
    environment:
      <<: *app-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN в .env}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:?задайте ADMIN_TG_IDS в .env}
      # необязательная: пусто — поддержка выключена
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
    # Больше 15 с, которые бот ждёт выполняющиеся обработчики при остановке.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/aggregator", "healthcheck", "bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/aggregator", "healthcheck", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - raw:/data/raw
    environment:
      <<: *app-env
      OWNER_CONTACT: ${OWNER_CONTACT:?задайте OWNER_CONTACT в .env}
      RAW_DIR: /data/raw

  # Mini App (Phase 15): токен бота, ADMIN_TG_IDS, OWNER_CONTACT и DEDUP_* сервису не
  # передаются; наружу он не слушает (expose, не ports), TLS — на caddy.
  webapp:
    <<: *app
    command: ["webapp"]
    profiles: ["webapp"]
    environment:
      # Упрощение: тот же пользователь БД, что у bot и worker (D-04); отдельная роль — позже.
      <<: *db-env
      WEBAPP_ADDR: 0.0.0.0:8080
      # Пусто при включённом профиле — процесс завершится с ошибкой, называющей переменную.
      WEBAPP_SECRET: ${WEBAPP_SECRET:-}
    expose: ["8080"]
    networks: [default, edge]
    # Больше 10 с, которые сервер ждёт текущие запросы при остановке.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/aggregator", "healthcheck", "webapp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Reverse proxy (D-01): сам получает и продлевает сертификат для WEBAPP_DOMAIN и
  # проксирует на webapp. Образ зафиксирован тегом и дайджестом (D-21). Запускается без
  # файла конфигурации; журнал запросов не ведётся.
  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    command: ["caddy", "reverse-proxy", "--from", "${WEBAPP_DOMAIN:-localhost}", "--to", "webapp:8080"]
    profiles: ["webapp"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443"]
    networks: [edge]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      webapp:
        condition: service_healthy
    logging: *log

networks:
  edge:

volumes:
  pgdata:
  raw:
  caddy_data:
  caddy_config:
